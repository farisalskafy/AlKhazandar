name: Build AlKhazandar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: تجهيز Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: فك ملفات المشروع
        run: |
          mkdir -p project
          unzip -o AlKhazandar-Android-Project.zip -d project

      - name: تجهيز Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: بناء التطبيق
        run: |
          cd project
          WRAPPER=$(find . -name gradlew -type f | head -1)
          if [ -n "$WRAPPER" ]; then
            chmod +x "$WRAPPER"
            cd "$(dirname "$WRAPPER")"
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: حفظ تطبيق APK
        uses: actions/upload-artifact@v4
        with:
          name: AlKhazandar-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
